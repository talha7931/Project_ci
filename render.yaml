services:
  # ─── Option 1: Full-Stack Web Service (FastAPI serving React SPA) ───
  - type: web
    name: url-sentinel
    runtime: python
    plan: free
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # ─── Option 2: Dedicated Backend API Web Service ───
  - type: web
    name: url-sentinel-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # ─── Option 3: Dedicated Frontend Static Site ───
  - type: web
    name: url-sentinel-ui
    runtime: static
    plan: free
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    envVars:
      - key: VITE_API_URL
        value: "https://url-sentinel-api.onrender.com"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"

