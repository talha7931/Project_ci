services:
  # Unified full-stack service: FastAPI serves the React SPA and POST /predict
  # from the same origin. Do not add a separate static site in this Blueprint —
  # static hosts return empty/non-JSON bodies for POST /predict.
  - type: web
    name: url-sentinel
    runtime: python
    plan: free
    region: oregon
    healthCheckPath: /health
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

